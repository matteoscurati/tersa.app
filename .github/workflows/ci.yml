name: CI

# Kept deliberately small: CI must stay fast and cheap (see AGENTS.md).
# Pull requests into main and pushes to main only; stacked pull requests get
# CI once they target main. Documentation-only changes skip the Rust build.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  linux:
    name: Linux
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Select commit range
        id: range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          {
            echo "base=$BASE"
            echo "head=$HEAD"
            echo "build=$(scripts/ci-needs-build.sh "$BASE" "$HEAD")"
          } >> "$GITHUB_OUTPUT"
      # Pushes check without merge commits: GitHub-created merges carry no
      # sign-off, and every authored commit they bring in is still checked.
      - name: Check DCO sign-offs
        if: ${{ github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000' }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/test_check_dco.py
          python3 scripts/check-dco.py ${{ github.event_name == 'push' && '--no-merges' || '' }} \
            "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"
      - name: Install policy tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-deny@0.20.2,typos-cli@1.48.0
      - name: Check spelling
        run: typos
      - name: Install pinned Rust toolchain
        if: steps.range.outputs.build == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          # Only main writes the dependency cache; pull requests restore it.
          cache-save-if: ${{ github.event_name == 'push' }}
      - name: Check dependencies (advisories, licenses, sources, bans)
        if: steps.range.outputs.build == 'true'
        run: cargo deny check
      - name: Run verification
        if: steps.range.outputs.build == 'true'
        run: cargo xtask verify

  # macOS runs only on pull requests: main receives only up-to-date pull
  # requests, so a post-merge macOS run would repeat a verified tree.
  macos:
    name: macOS
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Select commit range
        id: range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: echo "build=$(scripts/ci-needs-build.sh "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust toolchain
        if: steps.range.outputs.build == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
      - name: Run verification
        if: steps.range.outputs.build == 'true'
        run: cargo xtask verify

  ci_gate:
    name: CI gate
    needs: [linux, macos]
    if: ${{ always() && (github.event_name == 'push' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job
        env:
          LINUX: ${{ needs.linux.result }}
          MACOS: ${{ needs.macos.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "linux=$LINUX macos=$MACOS" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$LINUX" = success
          test "$MACOS" = success || { test "$EVENT" = push && test "$MACOS" = skipped; }
