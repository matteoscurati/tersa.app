name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  # Supersede stale commits only within one pull request. Merge-group runs keep
  # their unique run ID so concurrent queue checks do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  dco:
    name: DCO
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Test lightweight DCO checker
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/test_check_dco.py
      - name: Check pull request DCO sign-offs
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/check-dco.py
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  rust:
    name: Rust (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
      - name: Run verification
        run: cargo run --locked --package xtask -- verify

  policy:
    name: Policy and supply chain
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
      - name: Install policy tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-audit@0.22.1,cargo-deny@0.20.2,cargo-hack@0.6.45,typos-cli@1.48.0
      - name: Fetch locked dependencies for offline policy checks
        run: cargo fetch --locked
      - name: Check dependency licenses and sources
        run: cargo deny check
      - name: Check Rust security advisories
        run: cargo audit --deny warnings
      - name: Check feature combinations
        run: cargo hack check --locked --workspace --feature-powerset --all-targets
      - name: Check spelling
        run: typos

  ci_gate:
    name: CI gate
    needs: [dco, rust, policy]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          DCO_RESULT: ${{ needs.dco.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "dco=$DCO_RESULT" \
            "rust=$RUST_RESULT" \
            "policy=$POLICY_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$DCO_RESULT" = success
          test "$RUST_RESULT" = success
          test "$POLICY_RESULT" = success
