name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      evidence_suite:
        description: Evidence suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - product
          - slint
          - dioxus
          - sqlcipher
          - search
          - mime
          - mime-fuzz
          - blob
          - notices

permissions:
  contents: read

concurrency:
  # Supersede stale commits only within one pull request. Manual evidence runs
  # use their unique run ID so an explicitly requested capture is never lost.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pull request jobs test a synthetic merge commit, but evidence records the immutable source head.
  EVIDENCE_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    name: Detect change scope
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    outputs:
      product_apple: ${{ steps.scope.outputs.product_apple }}
      slint: ${{ steps.scope.outputs.slint }}
      dioxus: ${{ steps.scope.outputs.dioxus }}
      sqlcipher: ${{ steps.scope.outputs.sqlcipher }}
      search: ${{ steps.scope.outputs.search }}
      mime: ${{ steps.scope.outputs.mime }}
      mime_fuzz: ${{ steps.scope.outputs.mime_fuzz }}
      blob: ${{ steps.scope.outputs.blob }}
      notices: ${{ steps.scope.outputs.notices }}
      run_full_evidence: ${{ steps.scope.outputs.run_full_evidence }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Test change-scope classifier
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/test_ci_change_scope.py
      - name: Test macOS performance report contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/test_macos_performance_report.py
      - name: Determine change scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_SUITE: ${{ inputs.evidence_suite }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              case "$EVIDENCE_SUITE" in
                all)
                  python3 scripts/ci-change-scope.py --full >> "$GITHUB_OUTPUT"
                  echo "run_full_evidence=true" >> "$GITHUB_OUTPUT"
                  ;;
                product) scope_path='about-bridge.toml' ;;
                slint) scope_path='about.toml' ;;
                dioxus) scope_path='about-dioxus.toml' ;;
                sqlcipher) scope_path='about-sqlcipher.toml' ;;
                search) scope_path='about-search.toml' ;;
                mime) scope_path='about-mime.toml' ;;
                mime-fuzz) scope_path='fuzz/Cargo.lock' ;;
                blob) scope_path='about-blob.toml' ;;
                notices) scope_path='apple/licenses/rust-skia-notices.txt' ;;
                *) echo "Unsupported evidence suite: $EVIDENCE_SUITE" >&2; exit 1 ;;
              esac
              if [ "$EVIDENCE_SUITE" != all ]; then
                python3 scripts/ci-change-scope.py "$scope_path" >> "$GITHUB_OUTPUT"
                echo "run_full_evidence=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            merge_group)
              # The merge queue conservatively checks the product and notices
              # for the combined state. Deep evidence remains an explicit,
              # commit-selected workflow_dispatch operation.
              python3 scripts/ci-change-scope.py --full >> "$GITHUB_OUTPUT"
              echo "run_full_evidence=false" >> "$GITHUB_OUTPUT"
              ;;
            pull_request)
              # Diff from the merge base so a branch that is behind main reports
              # only its own changes, never files that advanced on the base branch.
              merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
              # Disable rename detection so both the removed source and added
              # destination are classified. A rename into docs must not hide a
              # production path from the fail-closed product gate.
              files="$(git diff --no-renames --name-only "$merge_base" "$HEAD_SHA")"
              printf 'changed files:\n%s\n' "$files"
              printf '%s\n' "$files" | python3 scripts/ci-change-scope.py \
                >> "$GITHUB_OUTPUT"
              echo "run_full_evidence=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported GitHub event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

  apple_product:
    name: Apple product
    needs: changes
    if: ${{ needs.changes.outputs.product_apple == 'true' }}
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TERSA_OAUTH_CLIENT_ID: public-ci-client.apps.googleusercontent.com
      TERSA_OAUTH_REDIRECT_SCHEME: app.tersa.oauth.ci
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
          cache-on-failure: false
          cache-save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify Xcode 26
        run: xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Install XcodeGen 2.45.4
        env:
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version | grep -Fx 'Version: 2.45.4'
      - name: Generate Apple project
        run: sh apple/scripts/generate-project.sh
      - name: Test unsigned macOS debug application
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaMac
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -derivedDataPath apple/build/DerivedData CODE_SIGNING_ALLOWED=NO
          TERSA_OAUTH_CLIENT_ID="$TERSA_OAUTH_CLIENT_ID"
          TERSA_OAUTH_REDIRECT_SCHEME="$TERSA_OAUTH_REDIRECT_SCHEME" test
      - name: Build unsigned iOS simulator debug application
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaIOS
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apple/build/DerivedData CODE_SIGNING_ALLOWED=NO
          TERSA_OAUTH_CLIENT_ID="$TERSA_OAUTH_CLIENT_ID"
          TERSA_OAUTH_REDIRECT_SCHEME="$TERSA_OAUTH_REDIRECT_SCHEME" build
      - name: Build unsigned iOS device debug application
        if: github.event_name == 'workflow_dispatch'
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaIOS
          -configuration Debug -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath apple/build/DerivedData CODE_SIGNING_ALLOWED=NO
          TERSA_OAUTH_CLIENT_ID="$TERSA_OAUTH_CLIENT_ID"
          TERSA_OAUTH_REDIRECT_SCHEME="$TERSA_OAUTH_REDIRECT_SCHEME" build
      - name: Archive unsigned macOS debug application
        if: github.event_name == 'workflow_dispatch'
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaMac
          -configuration Debug -destination 'generic/platform=macOS'
          -derivedDataPath apple/build/DerivedData CODE_SIGNING_ALLOWED=NO
          TERSA_OAUTH_CLIENT_ID="$TERSA_OAUTH_CLIENT_ID"
          TERSA_OAUTH_REDIRECT_SCHEME="$TERSA_OAUTH_REDIRECT_SCHEME" archive
          -archivePath apple/build/TersaMac.xcarchive
      - name: Archive unsigned iOS debug application
        if: github.event_name == 'workflow_dispatch'
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaIOS
          -configuration Debug -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath apple/build/DerivedData CODE_SIGNING_ALLOWED=NO
          TERSA_OAUTH_CLIENT_ID="$TERSA_OAUTH_CLIENT_ID"
          TERSA_OAUTH_REDIRECT_SCHEME="$TERSA_OAUTH_REDIRECT_SCHEME" archive
          -archivePath apple/build/TersaIOS.xcarchive
      - name: Verify built Rust bridge symbols
        run: |
          nm -gU apple/build/DerivedData/Build/Products/Debug/Tersa.app/Contents/MacOS/Tersa.debug.dylib \
            | grep -F '_tersa_apple_bridge_version'
          nm -gU apple/build/DerivedData/Build/Products/Debug-iphonesimulator/Tersa.app/Tersa.debug.dylib \
            | grep -F '_tersa_apple_bridge_version'
      - name: Verify archived Rust bridge symbols
        if: github.event_name == 'workflow_dispatch'
        run: |
          nm -gU apple/build/TersaMac.xcarchive/Products/Applications/Tersa.app/Contents/MacOS/Tersa \
            | grep -F '_tersa_apple_bridge_version'
          nm -gU apple/build/TersaIOS.xcarchive/Products/Applications/Tersa.app/Tersa \
            | grep -F '_tersa_apple_bridge_version'
      - name: Verify macOS mailbox-sync FFI archive symbols
        run: |
          set -euo pipefail
          # The macOS app links ONLY this archive (the bridge archive is no longer
          # built for macOS), so it must define the 5 mailbox-sync symbols AND
          # re-export all 11 bridge symbols. Assert the closed export inventory
          # in the archive so dead stripping cannot hide a missing entry point.
          archive="apple/build/rust/macosx/Debug/libtersa_mailbox_sync_ffi_macos.a"
          test -f "$archive"
          symbols="$(nm -g "$archive" | grep -E ' T _tersa_' | awk '{ print $NF }' | sort -u)"
          printf 'defined _tersa_ text symbols in %s:\n%s\n' "$archive" "$symbols"
          test "$(printf '%s\n' "$symbols" | grep -c .)" -eq 16
          for expected in \
            _tersa_apple_bridge_version \
            _tersa_macos_bootstrap_default_account \
            _tersa_macos_mailbox_read_inbox \
            _tersa_macos_mailbox_read_thread \
            _tersa_macos_mailbox_search \
            _tersa_mailbox_macos_connect_begin \
            _tersa_mailbox_macos_disconnect_begin \
            _tersa_mailbox_macos_lifecycle_get \
            _tersa_mailbox_macos_sync_begin \
            _tersa_mailbox_macos_sync_poll \
            _tersa_oauth_cancel \
            _tersa_oauth_ios_begin \
            _tersa_oauth_ios_finish \
            _tersa_oauth_macos_begin \
            _tersa_oauth_macos_entitlement_probe \
            _tersa_oauth_macos_poll
          do
            printf '%s\n' "$symbols" | grep -Fx "$expected" > /dev/null || {
              echo "missing defined text symbol: $expected" >&2
              exit 1
            }
          done
      - name: Link and execute the mailbox-sync FFI C probe
        run: |
          set -euo pipefail
          # A real Swift call site now pulls these symbols into the linked app
          # binary; this probe proves the mailbox-sync FFI archive LINKS as a
          # single archive (its own symbols AND the re-exported bridge ones
          # resolve) and that a bridge and a mailbox-sync entry point EXECUTE and
          # return their expected status. NOTE: static C↔Rust linking resolves by
          # symbol NAME only, so this does NOT verify argument/return ABI — a
          # widened return or an added parameter is invisible here (and poll(0)
          # short-circuits to -8 before reading any argument). ABI shape is
          # pinned per-side (the canonical header + the Rust export inventory);
          # this step is the single-archive link-and-run proof. The
          # pointer-taking begins are exercised through the app itself; their
          # decls stay _Nonnull-free so the Rust null rejection (-7) remains a
          # defined behavior, never a violable contract.
          archive="apple/build/rust/macosx/Debug/libtersa_mailbox_sync_ffi_macos.a"
          test -f "$archive"
          cat > "$RUNNER_TEMP/ffi_probe.c" <<'C'
          #include <stdint.h>
          uint32_t tersa_apple_bridge_version(void);
          int32_t tersa_mailbox_macos_sync_poll(uint64_t session_id);
          int main(void) {
              if (tersa_apple_bridge_version() == 0) {
                  return 1;
              }
              /* Session 0 is never registered: the poll must report unknown-session (-8). */
              if (tersa_mailbox_macos_sync_poll(0) != -8) {
                  return 2;
              }
              return 0;
          }
          C
          cc "$RUNNER_TEMP/ffi_probe.c" "$archive" \
            -framework Security -framework Foundation \
            -o "$RUNNER_TEMP/ffi_probe"
          "$RUNNER_TEMP/ffi_probe"
      - name: Verify OAuth PKCE and sandbox feasibility
        if: github.event_name == 'workflow_dispatch'
        run: sh apple/scripts/verify-oauth-feasibility.sh
      - name: Bind OAuth feasibility evidence to the source commit
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/write-evidence-manifest.py apple/build/oauth-evidence "$EVIDENCE_COMMIT_SHA"
      - name: Upload OAuth feasibility evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: oauth-pkce-feasibility-evidence
          path: apple/build/oauth-evidence
          if-no-files-found: error
          retention-days: 90
  slint-apple-evidence:
    name: Slint Apple evidence
    needs: [changes, manual_evidence_gate]
    if: ${{ needs.changes.outputs.run_full_evidence == 'true' || inputs.evidence_suite == 'slint' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
          cache-on-failure: false
          cache-save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify Xcode 26
        run: xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Install XcodeGen 2.45.4
        env:
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version | grep -Fx 'Version: 2.45.4'
      - name: Generate Apple project
        run: sh apple/scripts/generate-project.sh
      - name: Build and archive unsigned macOS Slint spike
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaSlintMac
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath apple/build/DerivedData CODE_SIGNING_ALLOWED=NO archive
          -archivePath apple/build/TersaSlintMac.xcarchive
      - name: Build unsigned iOS simulator Slint spike
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaSlintIOS
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apple/build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Archive unsigned iOS Slint spike
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaSlintIOS
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath apple/build/DerivedData CODE_SIGNING_ALLOWED=NO archive
          -archivePath apple/build/TersaSlintIOS.xcarchive
      - name: Verify and capture Slint spike evidence
        run: sh apple/scripts/capture-slint-evidence.sh
      - name: Bind Slint spike evidence to the source commit
        if: always()
        run: python3 scripts/write-evidence-manifest.py apple/build/slint-evidence "$EVIDENCE_COMMIT_SHA"
      - name: Upload Slint spike screenshots and metrics
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: slint-spike-evidence
          path: apple/build/slint-evidence
          if-no-files-found: error
          retention-days: 90

  dioxus-apple-evidence:
    name: Dioxus Apple evidence
    needs: [changes, manual_evidence_gate]
    if: ${{ needs.changes.outputs.run_full_evidence == 'true' || inputs.evidence_suite == 'dioxus' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
          cache-on-failure: false
          cache-save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify Xcode 26
        run: xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Install XcodeGen 2.45.4
        env:
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version | grep -Fx 'Version: 2.45.4'
      - name: Fetch locked dependencies for offline runtime verification
        run: cargo fetch --locked
      - name: Verify Dioxus runtime boundary
        run: python3 apple/scripts/verify-dioxus-runtime.py
      - name: Verify device evidence schema and redaction rejection
        run: |
          python3 apple/scripts/verify-dioxus-device-evidence.py --self-test
          sh -n apple/scripts/generate-project.sh
          sh -n apple/scripts/capture-dioxus-device-evidence.sh
          sh apple/scripts/capture-dioxus-device-evidence.sh --self-test-contract
          output=$(sh apple/scripts/capture-dioxus-device-evidence.sh)
          printf '%s\n' "$output" | grep -Fx 'DIOXUS DEVICE EVIDENCE DRY RUN'
          printf '%s\n' "$output" | grep -Fx 'No build, signing, installation, launch, or device command was executed.'
          printf '%s\n' "$output" | grep -Fx 'NOT A DEVICE-GATE RESULT'
          if sh apple/scripts/capture-dioxus-device-evidence.sh --execute >"$RUNNER_TEMP/opt-in-negative.txt" 2>&1; then
            exit 1
          fi
          grep -Fx 'Execution requires TERSA_DEVICE_EVIDENCE_OPT_IN=YES.' "$RUNNER_TEMP/opt-in-negative.txt"
          if TERSA_DEVICE_EVIDENCE_OPT_IN=YES \
            sh apple/scripts/capture-dioxus-device-evidence.sh --execute >"$RUNNER_TEMP/selector-negative.txt" 2>&1; then
            exit 1
          fi
          grep -Fx 'Execution requires a local TERSA_DEVICE_SELECTOR; it is never retained.' "$RUNNER_TEMP/selector-negative.txt"
          if TERSA_DEVICE_EVIDENCE_OPT_IN=YES TERSA_DEVICE_SELECTOR=synthetic \
            sh apple/scripts/capture-dioxus-device-evidence.sh --execute >"$RUNNER_TEMP/terminal-negative.txt" 2>&1; then
            exit 1
          fi
          grep -Fx 'Execution requires an interactive terminal.' "$RUNNER_TEMP/terminal-negative.txt"
          rm "$RUNNER_TEMP/opt-in-negative.txt" "$RUNNER_TEMP/selector-negative.txt" "$RUNNER_TEMP/terminal-negative.txt"
          cargo test --locked --offline --package tersa-dioxus-spike
      - name: Test patched Dioxus behavior
        run: cargo test --locked --offline --package dioxus-desktop --lib
      - name: Generate Apple project
        run: sh apple/scripts/generate-project.sh
      - name: Archive unsigned macOS Dioxus spike
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaDioxusMac
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath apple/build/DerivedDataDioxus CODE_SIGNING_ALLOWED=NO archive
          -archivePath apple/build/TersaDioxusMac.xcarchive
      - name: Build unsigned iOS simulator Dioxus spike
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaDioxusIOS
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apple/build/DerivedDataDioxus CODE_SIGNING_ALLOWED=NO build
      - name: Archive unsigned iOS Dioxus spike
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaDioxusIOS
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath apple/build/DerivedDataDioxus CODE_SIGNING_ALLOWED=NO archive
          -archivePath apple/build/TersaDioxusIOS.xcarchive
      - name: Verify and capture Dioxus spike evidence
        run: sh apple/scripts/capture-dioxus-evidence.sh
      - name: Bind Dioxus spike evidence to the source commit
        if: always()
        run: python3 scripts/write-evidence-manifest.py apple/build/dioxus-evidence "$EVIDENCE_COMMIT_SHA"
      - name: Upload Dioxus spike screenshots and metrics
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: dioxus-spike-evidence
          path: apple/build/dioxus-evidence
          if-no-files-found: error
          retention-days: 90

  sqlcipher-apple-evidence:
    name: SQLCipher Apple evidence
    needs: [changes, manual_evidence_gate]
    if: ${{ needs.changes.outputs.run_full_evidence == 'true' || inputs.evidence_suite == 'sqlcipher' }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: "18.0"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
          cache-on-failure: false
          cache-save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify Xcode 26
        run: xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Build SQLCipher diagnostic for iOS targets
        run: |
          cargo build --locked --package tersa-sqlcipher-spike --target aarch64-apple-ios
          cargo build --locked --package tersa-sqlcipher-spike --target aarch64-apple-ios-sim
      - name: Verify SQLCipher storage feasibility
        run: sh apple/scripts/verify-sqlcipher-feasibility.sh
      - name: Bind SQLCipher feasibility evidence to the source commit
        if: ${{ always() && hashFiles('apple/build/sqlcipher-evidence/result.txt') != '' }}
        run: python3 scripts/write-evidence-manifest.py apple/build/sqlcipher-evidence "$EVIDENCE_COMMIT_SHA"
      - name: Upload SQLCipher feasibility evidence
        if: ${{ always() && hashFiles('apple/build/sqlcipher-evidence/result.txt') != '' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: sqlcipher-feasibility-evidence
          path: apple/build/sqlcipher-evidence
          if-no-files-found: error
          retention-days: 90

  search-apple-evidence:
    name: Search Apple evidence
    needs: [changes, manual_evidence_gate]
    if: ${{ needs.changes.outputs.run_full_evidence == 'true' || inputs.evidence_suite == 'search' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: "18.0"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
          cache-on-failure: false
          cache-save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify Xcode 26
        run: xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Cross-build encrypted search diagnostic
        run: |
          cargo build --locked --release --package tersa-search-spike --target aarch64-apple-darwin
          cargo build --locked --release --package tersa-search-spike --target aarch64-apple-ios
          cargo build --locked --release --package tersa-search-spike --target aarch64-apple-ios-sim
      - name: Verify encrypted search feasibility
        run: sh apple/scripts/verify-search-feasibility.sh
      - name: Bind encrypted search evidence to the source commit
        if: ${{ always() && hashFiles('apple/build/search-evidence/result.txt') != '' }}
        run: python3 scripts/write-evidence-manifest.py apple/build/search-evidence "$EVIDENCE_COMMIT_SHA"
      - name: Upload encrypted search evidence
        if: ${{ always() && hashFiles('apple/build/search-evidence/result.txt') != '' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: encrypted-search-feasibility-evidence
          path: apple/build/search-evidence
          if-no-files-found: error
          retention-days: 90

  mime-apple-evidence:
    name: MIME and HTML Apple evidence
    needs: [changes, manual_evidence_gate]
    if: ${{ needs.changes.outputs.run_full_evidence == 'true' || inputs.evidence_suite == 'mime' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: "18.0"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
          cache-on-failure: false
          cache-save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify Xcode 26
        run: xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Install XcodeGen 2.45.4
        env:
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version | grep -Fx 'Version: 2.45.4'
      - name: Cross-build portable MIME diagnostic
        run: |
          cargo build --locked --release --package tersa-mime-spike --target aarch64-apple-darwin
          cargo build --locked --release --package tersa-mime-spike --target aarch64-apple-ios
          cargo build --locked --release --package tersa-mime-spike --target aarch64-apple-ios-sim
      - name: Generate Apple project
        run: sh apple/scripts/generate-project.sh
      - name: Archive unsigned macOS MIME diagnostic
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaMimeMac
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath apple/build/DerivedDataMime CODE_SIGNING_ALLOWED=NO archive
          -archivePath apple/build/TersaMimeMac.xcarchive
      - name: Build unsigned iOS simulator MIME diagnostic
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaMimeIOS
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apple/build/DerivedDataMime CODE_SIGNING_ALLOWED=NO build
      - name: Archive unsigned iOS MIME diagnostic
        run: >-
          xcodebuild -project apple/Tersa.xcodeproj -scheme TersaMimeIOS
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath apple/build/DerivedDataMime CODE_SIGNING_ALLOWED=NO archive
          -archivePath apple/build/TersaMimeIOS.xcarchive
      - name: Verify hostile MIME and HTML controls
        run: sh apple/scripts/verify-mime-feasibility.sh
      - name: Bind MIME feasibility evidence to the source commit
        if: ${{ always() && hashFiles('apple/build/mime-evidence/result.txt') != '' }}
        run: python3 scripts/write-evidence-manifest.py apple/build/mime-evidence "$EVIDENCE_COMMIT_SHA"
      - name: Upload MIME feasibility evidence
        if: ${{ always() && hashFiles('apple/build/mime-evidence/result.txt') != '' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: mime-html-feasibility-evidence
          path: apple/build/mime-evidence
          if-no-files-found: error
          retention-days: 90

  mime-parser-fuzz:
    name: Deterministic MIME parser fuzz regression
    needs: [changes, manual_evidence_gate]
    if: ${{ needs.changes.outputs.run_full_evidence == 'true' || inputs.evidence_suite == 'mime-fuzz' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install exact nightly toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: nightly-2026-07-14
          components: clippy,rust-src,rustfmt
          cache-on-failure: false
          cache-save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Install exact fuzz and policy tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-fuzz@0.13.2,cargo-audit@0.22.1,cargo-deny@0.20.2
      - name: Verify pinned fuzz tools
        run: |
          rustup show active-toolchain | grep -F 'nightly-2026-07-14'
          cargo fuzz --version | grep -Fx 'cargo-fuzz 0.13.2'
          cargo-audit --version | grep -Fx 'cargo-audit 0.22.1'
          cargo-deny --version | grep -Fx 'cargo-deny 0.20.2'
      - name: Fetch standalone fuzz dependencies
        run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Check standalone fuzz licenses, advisories, and sources
        run: |
          cargo deny --locked --manifest-path fuzz/Cargo.toml \
            --config fuzz/deny.toml check
          cargo audit --file fuzz/Cargo.lock --deny warnings
      - name: Check standalone fuzz formatting and lints
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo clippy --locked --manifest-path fuzz/Cargo.toml \
            --all-targets -- -D warnings
      - name: Verify fuzz dependencies stay outside application graphs
        run: |
          application_tree=$(cargo tree --locked --workspace --edges normal,build)
          if printf '%s\n' "$application_tree" \
            | grep -E 'libfuzzer-sys|tersa-mime-fuzz'; then
            exit 1
          fi
      - name: Build, replay seeds, and run finite MIME fuzz regression
        run: sh scripts/verify-mime-fuzz.sh
        env:
          TERSA_FUZZ_TARGET: x86_64-unknown-linux-gnu
      - name: Bind MIME fuzz evidence to the source commit
        if: ${{ always() && hashFiles('fuzz/target/mime-fuzz-evidence/result.txt') != '' }}
        run: >-
          python3 scripts/write-evidence-manifest.py
          fuzz/target/mime-fuzz-evidence "$EVIDENCE_COMMIT_SHA"
      - name: Upload MIME parser fuzz evidence
        if: ${{ always() && hashFiles('fuzz/target/mime-fuzz-evidence/result.txt') != '' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: mime-parser-fuzz-evidence
          path: fuzz/target/mime-fuzz-evidence
          if-no-files-found: error
          retention-days: 90

  blob-apple-evidence:
    name: Crash-safe AEAD blob Apple evidence
    needs: [changes, manual_evidence_gate]
    if: ${{ needs.changes.outputs.run_full_evidence == 'true' || inputs.evidence_suite == 'blob' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: "18.0"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
          cache-on-failure: false
          cache-save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify Xcode 26
        run: xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Cross-build portable blob diagnostic for iOS
        run: |
          cargo build --locked --release --package tersa-blob-spike --target aarch64-apple-ios
          cargo build --locked --release --package tersa-blob-spike --target aarch64-apple-ios-sim
      - name: Verify crash-safe chunked-AEAD blob controls
        run: sh apple/scripts/verify-blob-feasibility.sh
      - name: Bind blob feasibility evidence to the source commit
        if: ${{ always() && hashFiles('apple/build/blob-evidence/result.txt') != '' }}
        run: python3 scripts/write-evidence-manifest.py apple/build/blob-evidence "$EVIDENCE_COMMIT_SHA"
      - name: Upload blob feasibility evidence
        if: ${{ always() && hashFiles('apple/build/blob-evidence/result.txt') != '' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: crash-safe-aead-blob-feasibility-evidence
          path: apple/build/blob-evidence
          if-no-files-found: error
          retention-days: 90

  notices:
    name: Third-party notices
    needs: changes
    if: ${{ needs.changes.outputs.notices == 'true' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Install notice generator
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-about@0.9.1
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check target-specific third-party notices
        run: sh apple/scripts/generate-third-party-notices.sh --check

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Prepare verified rust-skia archive
        if: runner.os == 'macOS'
        run: |
          skia_url=$(sh apple/scripts/prepare-verified-skia.sh aarch64-apple-darwin)
          printf 'SKIA_BINARIES_URL=%s\n' "$skia_url" >> "$GITHUB_ENV"
      - name: Run baseline verification
        run: cargo run --locked --package xtask -- verify

  policy:
    name: Policy and supply chain
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-on-failure: false
          cache-save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Verify M0 product gates
        run: |
          python3 scripts/verify-m0-gates.py --self-test
          python3 scripts/write-evidence-manifest.py --self-test
      - name: Install policy tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-audit@0.22.1,cargo-deny@0.20.2,cargo-hack@0.6.45,typos-cli@1.48.0
      - name: Fetch locked dependencies for offline policy checks
        run: cargo fetch --locked
      - name: Check dependency licenses and sources
        run: cargo deny check
      - name: Check Rust security advisories
        # cargo-audit cannot derive target reachability from Cargo.lock. These
        # time-bounded ignores cover existing Apple-reachable findings plus
        # Dioxus/Wry dependencies that the verifier proves unreachable from the
        # macOS, iOS device, and iOS simulator graphs. The Dioxus diagnostic
        # remains rejected for production.
        run: >-
          cargo audit
          --deny warnings
          --ignore RUSTSEC-2024-0370
          --ignore RUSTSEC-2024-0411
          --ignore RUSTSEC-2024-0412
          --ignore RUSTSEC-2024-0413
          --ignore RUSTSEC-2024-0414
          --ignore RUSTSEC-2024-0415
          --ignore RUSTSEC-2024-0416
          --ignore RUSTSEC-2024-0418
          --ignore RUSTSEC-2024-0419
          --ignore RUSTSEC-2024-0420
          --ignore RUSTSEC-2024-0429
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2025-0057
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2026-0097
          --ignore RUSTSEC-2026-0192
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
          --ignore RUSTSEC-2026-0206
      - name: Enforce temporary Slint advisory review deadline
        shell: bash
        run: '[[ "$(date -u +%F)" < "2026-08-15" ]]'
      - name: Enforce temporary Dioxus advisory review deadline
        shell: bash
        run: '[[ "$(date -u +%F)" < "2026-08-15" ]]'
      - name: Check feature combinations
        run: cargo hack check --locked --workspace --feature-powerset --all-targets
      - name: Check spelling
        run: typos
      - name: Check pull request DCO sign-offs
        if: github.event_name == 'pull_request'
        run: >-
          cargo run --locked --package xtask -- dco
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
  ci_gate:
    name: CI gate
    needs: [changes, apple_product, notices, rust, policy]
    if: ${{ always() && github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected validation lane
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APPLE_PRODUCT_RESULT: ${{ needs.apple_product.result }}
          NOTICES_RESULT: ${{ needs.notices.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "changes=$CHANGES_RESULT" \
            "apple_product=$APPLE_PRODUCT_RESULT" \
            "notices=$NOTICES_RESULT" \
            "rust=$RUST_RESULT" \
            "policy=$POLICY_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$CHANGES_RESULT" = success
          case "$APPLE_PRODUCT_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
          case "$NOTICES_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
          test "$RUST_RESULT" = success
          test "$POLICY_RESULT" = success
  manual_evidence_gate:
    # Keep manual evidence isolated from the branch-protection context. A
    # narrowly selected suite must never satisfy the pull request's `CI gate`.
    name: Manual evidence gate
    needs: [changes, apple_product, notices, rust, policy]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected validation lane
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APPLE_PRODUCT_RESULT: ${{ needs.apple_product.result }}
          NOTICES_RESULT: ${{ needs.notices.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "changes=$CHANGES_RESULT" \
            "apple_product=$APPLE_PRODUCT_RESULT" \
            "notices=$NOTICES_RESULT" \
            "rust=$RUST_RESULT" \
            "policy=$POLICY_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$CHANGES_RESULT" = success
          case "$APPLE_PRODUCT_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
          case "$NOTICES_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
          test "$RUST_RESULT" = success
          test "$POLICY_RESULT" = success
