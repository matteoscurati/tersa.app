[package]
name = "tersa-vault"
description = "Root-key vault for tersa: OS keyring or passphrase-wrapped file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
keyring-core = "1.0.0"
rustix = { workspace = true, features = ["fs", "process"] }
tersa-keys.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-openssl"] }

[lints]
workspace = true
