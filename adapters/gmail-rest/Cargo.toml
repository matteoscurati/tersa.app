[package]
name = "tersa-gmail-rest"
description = "Gmail REST mailbox adapter and OAuth token transport for tersa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tersa-application = { workspace = true }
tersa-domain = { path = "../../crates/domain", version = "=0.0.0" }
url.workspace = true
reqwest.workspace = true
zeroize.workspace = true

# macOS uses Security.framework through native-tls; Linux builds a static
# OpenSSL, shared with SQLCipher, so release binaries do not depend on the
# host's libssl.
[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { workspace = true, features = ["native-tls-vendored"] }

[lints]
workspace = true
