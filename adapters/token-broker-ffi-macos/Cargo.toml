[package]
name = "tersa-token-broker-ffi-macos"
description = "macOS-only C ABI for the token-broker XPC composition: broker core, Google transport, and broker-only Keychain store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

# Every dependency is macOS-only: on other targets the crate compiles to an empty
# library that exports no symbols. The XPC service links ONLY this archive.
[target.'cfg(target_os = "macos")'.dependencies]
tersa-application = { path = "../../crates/application", version = "=0.0.0" }
tersa-domain = { path = "../../crates/domain", version = "=0.0.0" }
tersa-gmail-rest-macos = { path = "../gmail-rest-macos", version = "=0.0.0" }
tersa-keychain-macos = { path = "../keychain-macos", version = "=0.0.0" }
tersa-token-broker-core = { path = "../token-broker-core", version = "=0.0.0" }
tokio = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
