[package]
name = "tersa-store-sqlcipher"
description = "Account-scoped SQLCipher mailbox store for tersa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
tersa-application = { workspace = true }
tersa-domain = { path = "../../crates/domain", version = "=0.0.0" }

rusqlite = { workspace = true, default-features = false, features = ["bundled-sqlcipher"] }
rustix = { workspace = true, features = ["fs", "process"] }
zeroize.workspace = true

# macOS links SQLCipher against CommonCrypto; Linux builds a static OpenSSL so
# release binaries do not depend on the host's libcrypto.
[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { workspace = true, default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }

[lints]
workspace = true
