name: Tersa
options:
  bundleIdPrefix: app.tersa
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  xcodeVersion: "26.0"
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    TERSA_OAUTH_CLIENT_ID: UNCONFIGURED
    TERSA_OAUTH_REDIRECT_SCHEME: app.tersa.oauth.UNCONFIGURED
    TERSA_EVIDENCE_COMMIT: UNCONFIGURED
    TERSA_DIOXUS_CODE_SIGNING_ALLOWED: "NO"
    TERSA_DIOXUS_CODE_SIGNING_REQUIRED: "NO"
    TERSA_DIOXUS_DEVELOPMENT_TEAM: ""
    TERSA_DIOXUS_CODE_SIGN_STYLE: Automatic
    TERSA_DIOXUS_CODE_SIGN_IDENTITY: ""
    TERSA_DIOXUS_PROVISIONING_PROFILE_SPECIFIER: ""
targets:
  TersaMac:
    type: application
    platform: macOS
    sources:
      - path: macos
      - path: licenses/THIRD_PARTY_NOTICES-bridge-macos.txt
        buildPhase: resources
    info:
      path: macos/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: macos/TersaMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.application-groups:
          - ${TeamIdentifierPrefix}app.tersa.shared
        keychain-access-groups:
          - ${TeamIdentifierPrefix}app.tersa.shared
    dependencies:
      - target: TersaMacTokenBroker
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tersa.mac
        PRODUCT_NAME: Tersa
        TERSA_MACOS_APP_GROUP: "$(TeamIdentifierPrefix)app.tersa.shared"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: macos/TersaMac.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: macos/TersaMac-Bridging-Header.h
        # Cargo and rustup read their compiler sysroot outside SRCROOT. Keep
        # this exception scoped to the target that invokes the locked script.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        OTHER_LDFLAGS:
          - "$(SRCROOT)/build/rust/$(PLATFORM_NAME)/$(CONFIGURATION)/libtersa_mailbox_sync_ffi_macos.a"
    preBuildScripts:
      - name: Build Rust static library
        basedOnDependencyAnalysis: false
        script: 'sh "${SRCROOT}/scripts/build-rust-staticlib.sh" macos "${CONFIGURATION}"'
    scheme:
      testTargets:
        - TersaMacTests
  TersaMacTokenBroker:
    type: xpc-service
    platform: macOS
    sources:
      - path: macos-token-broker
    info:
      path: macos-token-broker/Info.plist
      properties:
        CFBundlePackageType: XPC!
        XPCService:
          ServiceType: Application
        TersaOAuthClientID: "$(TERSA_OAUTH_CLIENT_ID)"
    entitlements:
      path: macos-token-broker/TersaMacTokenBroker.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - ${TeamIdentifierPrefix}app.tersa.token
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tersa.mac.token-broker
        PRODUCT_NAME: TersaMacTokenBroker
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: macos-token-broker/TersaMacTokenBroker.entitlements
        SKIP_INSTALL: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: macos-token-broker/TersaMacTokenBroker-Bridging-Header.h
        TERSA_MACOS_TOKEN_GROUP: "$(TeamIdentifierPrefix)app.tersa.token"
        # Cargo and rustup read their compiler sysroot outside SRCROOT. Keep
        # this exception scoped to the target that invokes the locked script.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        OTHER_LDFLAGS:
          - "$(SRCROOT)/build/rust/$(PLATFORM_NAME)/$(CONFIGURATION)/libtersa_token_broker_ffi_macos.a"
    preBuildScripts:
      - name: Build Rust token-broker static library
        basedOnDependencyAnalysis: false
        script: 'sh "${SRCROOT}/scripts/build-rust-staticlib.sh" macos-token-broker "${CONFIGURATION}"'
  TersaMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: macos-tests
      # Compile the coordinator and broker client mapping directly so
      # deterministic tests do not invoke the app target's AppKit/FFI bootstrap
      # or live OAuth/Keychain/network surfaces.
      - path: macos/ConnectionOperationDeadline.swift
      - path: macos/ConnectionState.swift
      - path: macos/DisconnectIntentStore.swift
      - path: macos/MailboxLifecyclePresentation.swift
      - path: macos/TokenBrokerProtocol.swift
      - path: macos/TokenBrokerClient.swift
      - path: macos/TokenBrokerStatusMapping.swift
      # Authorization-session loopback helpers only; no live XPC/network begin.
      - path: macos/TokenBrokerAuthorizationSession.swift
      # Shared complete-path callback buffer helper (also compiled into the
      # signed broker target). Tests must exercise this production helper.
      - path: macos-token-broker/TokenBrokerCallbackBuffer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tersa.mac.tests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
  TersaIOS:
    type: application
    platform: iOS
    sources:
      - path: ios
      - path: licenses/THIRD_PARTY_NOTICES-bridge-ios.txt
        buildPhase: resources
    info:
      path: ios/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "$(TERSA_OAUTH_REDIRECT_SCHEME)"
        TersaOAuthClientID: "$(TERSA_OAUTH_CLIENT_ID)"
        TersaOAuthRedirectScheme: "$(TERSA_OAUTH_REDIRECT_SCHEME)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: ios/TersaIOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tersa.ios
        PRODUCT_NAME: Tersa
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: ios/TersaIOS.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ios/TersaIOS-Bridging-Header.h
        # Cargo and rustup read their compiler sysroot outside SRCROOT. Keep
        # this exception scoped to the target that invokes the locked script.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        OTHER_LDFLAGS:
          - "$(SRCROOT)/build/rust/$(PLATFORM_NAME)/$(CONFIGURATION)/libtersa_apple_bridge.a"
    preBuildScripts:
      - name: Build Rust static library
        basedOnDependencyAnalysis: false
        script: 'sh "${SRCROOT}/scripts/build-rust-staticlib.sh" ios "${CONFIGURATION}"'
    scheme:
      testTargets: []
  TersaSlintMac:
    type: application
    platform: macOS
    sources:
      - path: licenses/THIRD_PARTY_NOTICES-macos.txt
        buildPhase: resources
    info:
      path: slint-macos/Info.plist
      properties:
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tersa.slint-spike.mac
        PRODUCT_NAME: Tersa Slint Spike
        EXECUTABLE_NAME: tersa-slint-spike
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        # Cargo and rustup read their compiler sysroot outside SRCROOT. This
        # exception is restricted to the target that packages the Rust binary.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    postCompileScripts:
      - name: Build Rust Slint executable
        basedOnDependencyAnalysis: false
        script: 'sh "${SRCROOT}/scripts/build-slint-executable.sh" macos "${CONFIGURATION}"'
    scheme:
      testTargets: []
  TersaSlintIOS:
    type: application
    platform: iOS
    sources:
      - path: licenses/THIRD_PARTY_NOTICES-ios.txt
        buildPhase: resources
    info:
      path: slint-ios/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tersa.slint-spike.ios
        PRODUCT_NAME: Tersa Slint Spike
        EXECUTABLE_NAME: tersa-slint-spike
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Cargo and rustup read their compiler sysroot outside SRCROOT. This
        # exception is restricted to the target that packages the Rust binary.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    postCompileScripts:
      - name: Build Rust Slint executable
        basedOnDependencyAnalysis: false
        script: 'sh "${SRCROOT}/scripts/build-slint-executable.sh" ios "${CONFIGURATION}"'
    scheme:
      testTargets: []
  TersaDioxusMac:
    type: application
    platform: macOS
    sources:
      - path: licenses/THIRD_PARTY_NOTICES-dioxus-macos.txt
        buildPhase: resources
    info:
      path: dioxus-macos/Info.plist
      properties:
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tersa.dioxus-spike.mac
        PRODUCT_NAME: Tersa Dioxus Spike
        EXECUTABLE_NAME: tersa-dioxus-spike
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        # Cargo and rustup read their compiler sysroot outside SRCROOT. This
        # exception is restricted to the target that packages the Rust binary.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    postCompileScripts:
      - name: Build Rust Dioxus executable
        basedOnDependencyAnalysis: false
        script: 'sh "${SRCROOT}/scripts/build-dioxus-executable.sh" macos "${CONFIGURATION}"'
    scheme:
      testTargets: []
  TersaDioxusIOS:
    type: application
    platform: iOS
    sources:
      - path: licenses/THIRD_PARTY_NOTICES-dioxus-ios.txt
        buildPhase: resources
    info:
      path: dioxus-ios/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tersa.dioxus-spike.ios
        PRODUCT_NAME: Tersa Dioxus Spike
        EXECUTABLE_NAME: tersa-dioxus-spike
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "$(TERSA_DIOXUS_CODE_SIGNING_ALLOWED)"
        CODE_SIGNING_REQUIRED: "$(TERSA_DIOXUS_CODE_SIGNING_REQUIRED)"
        DEVELOPMENT_TEAM: "$(TERSA_DIOXUS_DEVELOPMENT_TEAM)"
        CODE_SIGN_STYLE: "$(TERSA_DIOXUS_CODE_SIGN_STYLE)"
        CODE_SIGN_IDENTITY: "$(TERSA_DIOXUS_CODE_SIGN_IDENTITY)"
        PROVISIONING_PROFILE_SPECIFIER: "$(TERSA_DIOXUS_PROVISIONING_PROFILE_SPECIFIER)"
        # Cargo and rustup read their compiler sysroot outside SRCROOT. This
        # exception is restricted to the target that packages the Rust binary.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    postCompileScripts:
      - name: Build Rust Dioxus executable
        basedOnDependencyAnalysis: false
        script: 'sh "${SRCROOT}/scripts/build-dioxus-executable.sh" ios "${CONFIGURATION}"'
    scheme:
      testTargets: []
  TersaMimeMac:
    type: application
    platform: macOS
    sources:
      - path: mime-common
      - path: mime-macos
      - path: licenses/THIRD_PARTY_NOTICES-mime-macos.txt
        buildPhase: resources
    info:
      path: mime-macos/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSHighResolutionCapable: true
    entitlements:
      path: mime-macos/TersaMimeMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tersa.mime-spike.mac
        PRODUCT_NAME: Tersa MIME Spike
        EXECUTABLE_NAME: tersa-mime-native-spike
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: mime-macos/TersaMimeMac.entitlements
    scheme:
      testTargets: []
  TersaMimeIOS:
    type: application
    platform: iOS
    sources:
      - path: mime-common
      - path: mime-ios
      - path: licenses/THIRD_PARTY_NOTICES-mime-ios.txt
        buildPhase: resources
    info:
      path: mime-ios/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tersa.mime-spike.ios
        PRODUCT_NAME: Tersa MIME Spike
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
